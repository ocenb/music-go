services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      music-go-network:
        aliases:
          - content-service-app
    dns:
      - 8.8.8.8
      - 8.8.4.4

  postgres:
    image: postgres:18.3-alpine3.23
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-user-service-db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - music-go-network

volumes:
  postgres_data:

networks:
  music-go-network:
    name: music-go-network
    external: true

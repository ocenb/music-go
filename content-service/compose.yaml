services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: content-service-postgres
      POSTGRES_PORT: 5432
      SEARCH_SERVICE_ADDRESS: search-service-app:9091
      USER_SERVICE_ADDRESS: user-service-app:9090
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: email-notifications
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      music-go-network:
        aliases:
          - content-service-app

  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-content-service-db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      music-go-network:
        aliases:
          - content-service-postgres

volumes:
  postgres_data:

networks:
  music-go-network:
    name: music-go-network
    external: true

version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - funcorder
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godot
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - makezero
    - mirror
    - mnd
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testifylint
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  settings:
    depguard:
      rules:
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead
        "non-main files":
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead

    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      # Such cases aren't reported by default.
      # Default: false
      check-type-assertions: true

    exhaustive:
      # Program elements to check for exhaustiveness.
      # Default: [ switch ]
      check:
        - switch
        - map

    exhaustruct:
      # Checks if all structure fields are initialized.
      # Lazy-init / intentionally omitted fields: mark with `exhaustruct:"optional"` tag
      include:
        - '.*/handlers\..*(Handler|Server)$'
        - '.*/services/.+\.Service$'
        - '.*/repos/.+\.Repo$'

    funcorder:
      # Checks if the exported methods of a structure are placed before the non-exported ones.
      # Default: true
      struct-method: false

    gocognit:
      # Minimal code complexity to report.
      # Default: 30
      min-complexity: 50

    gocritic:
      # Default: false
      enable-all: false
      enabled-checks:
        - httpNoBody
        - importShadow
        - nilValReturn
        - octalLiteral
        - paramTypeCombine
        - regexpSimplify
      # disabled-checks:
      #   # Detects params that incur excessive amount of copying.
      #   - hugeParam
      #   # Detects loops that copy big objects during each iteration.
      #   - rangeValCopy
      #   # Detects suspicious/confusing re-assignments.
      #   - sloppyReassign
      #   # Detects unnamed results that may benefit from names.
      #   - unnamedResult

    govet:
      # Enable all analyzers.
      # Default: false
      enable-all: true
      # Disable analyzers by name.
      # Run `GL_DEBUG=govet golangci-lint run --enable=govet` to see default, all available analyzers, and enabled analyzers.
      # Default: []
      disable:
        - fieldalignment # too strict
      # Settings per analyzer.
      settings:
        shadow:
          # Whether to be strict about shadowing; can be noisy.
          # Default: false
          strict: false

    mnd:
      # List of function patterns to exclude from analysis.
      # Values always ignored: `time.Date`,
      # `strconv.FormatInt`, `strconv.FormatUint`, `strconv.FormatFloat`,
      # `strconv.ParseInt`, `strconv.ParseUint`, `strconv.ParseFloat`.
      # Default: []
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets

    nolintlint:
      allow-no-explanation: [gocognit]
      # Enable to require an explanation of nonzero length after each nolint directive.
      # Default: false
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed.
      # Default: false
      require-specific: true

    perfsprint:
      strconcat: false

    sloglint:
      no-global: all
      # Report the use of functions without a context.Context.
      # https://github.com/go-simpler/sloglint#context-only
      # Values: "all", "scope"
      # Default: "" (disabled)
      context: scope

    staticcheck:
      # SAxxxx checks in https://staticcheck.dev/docs/configuration/options/#checks
      # Example (to disable some checks): [ "all", "-SA1000", "-SA1001"]
      # Default: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
      checks:
        - all
        # Incorrect or missing package comment.
        # https://staticcheck.dev/docs/checks/#ST1000
        - -ST1000
        # Use consistent method receiver names.
        # https://staticcheck.dev/docs/checks/#ST1016
        - -ST1016
        # Omit embedded fields from selector expression.
        # https://staticcheck.dev/docs/checks/#QF1008
        - -QF1008

    usetesting:
      os-temp-dir: true

  exclusions:
    warn-unused: false

    presets:
      - std-error-handling
      - common-false-positives

    rules:
      - source: "TODO"
        linters: [godot]

      - text: "should have a package comment"
        linters: [revive]

      - text: 'exported \S+ \S+ should have comment( \(or a comment on this block\))? or be unexported'
        linters: [revive]

      - text: 'package comment should be of the form ".+"'
        source: "// ?(nolint|TODO)"
        linters: [revive]

      - text: 'comment on exported \S+ \S+ should be of the form ".+"'
        source: "// ?(nolint|TODO)"
        linters: [revive, staticcheck]

      - path: '_test\.go'
        linters:
          - bodyclose
          - dupl
          - errcheck
          - goconst
          - gosec
          - noctx
          - forbidigo

      - path: "tests/"
        text: "missing the call to method parallel in the test run"
        linters: [paralleltest]

      - path: "tests/"
        linters:
          - forbidigo
          - tparallel

      - path: 'repo_test\.go'
        text: "missing the call to method parallel in the test run"
        linters: [paralleltest]

      - path: 'repo_test\.go'
        linters:
          - tparallel

      - path: 'repo\.go'
        linters:
          - goconst

      - path-except: internal/repos/
        linters:
          - unqueryvet

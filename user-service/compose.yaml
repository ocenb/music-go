services:
  app:
    build: .
    ports:
      - "${PORT:-9090}:9090"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SEARCH_SERVICE_ADDRESS: search-service-app:9091
      CONTENT_SERVICE_URL: http://content-service-app:3000
      KAFKA_BROKERS: kafka:19092
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - music-go-network

  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-user-service-db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - music-go-network

volumes:
  postgres_data:

networks:
  music-go-network:
    name: music-go-network
    external: true

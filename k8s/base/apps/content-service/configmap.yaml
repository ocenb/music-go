apiVersion: v1
kind: ConfigMap
metadata:
  name: content-service-config
data:
  local.yaml: |
    log_level: 0
    log_handler: text
    db_max_open_conns: 10
    db_max_idle_conns: 5
    db_conn_max_lifetime: 1h
    db_connect_timeout: 10s
    shutdown_timeout: 30s
    image_file_limit: 10485760
    audio_file_limit: 52428800
    http:
      port: 3000
      read_timeout: 60s
      write_timeout: 60s

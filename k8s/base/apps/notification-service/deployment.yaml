apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: music-go/notification-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT
              value: local
            - name: KAFKA_BROKERS
              value: kafka-service:9092
            - name: KAFKA_TOPIC
              value: email-notifications
            - name: KAFKA_GROUP_ID
              value: notification-service
            - name: SMTP_HOST
              value: smtp.gmail.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: SMTP_PASSWORD
          volumeMounts:
            - name: notification-service-config-volume
              mountPath: /app/config/local.yaml
              subPath: local.yaml
      volumes:
        - name: notification-service-config-volume
          configMap:
            name: notification-service-config

services:
  app:
    build: .
    ports:
      - "${PORT:-9091}:9091"
    env_file:
      - .env
    environment:
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      USER_SERVICE_ADDRESS: user-service-app:9090
    volumes:
      - ./config:/app/config
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9091"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      music-go-network:
        aliases:
          - search-service-app

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - music-go-network

volumes:
  elasticsearch_data:

networks:
  music-go-network:
    name: music-go-network
    external: true
